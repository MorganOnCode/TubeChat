name: Ingest YouTube Transcripts

on:
  workflow_dispatch:
    inputs:
      collection:
        description: 'Collection slug to ingest (default: all)'
        required: false
        default: 'ufo'
      limit:
        description: 'Videos per channel'
        required: false
        default: '5'
      skip_llm:
        description: 'Skip LLM processing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Run daily at 6am UTC (1pm Bangkok)
    - cron: '0 6 * * *'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Create .env
        run: |
          cat > .env << EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          EOF

      - name: Test transcript extraction
        run: |
          yt-dlp --write-auto-sub --sub-lang en --sub-format json3 --skip-download --no-warnings -o "/tmp/test_caption" "https://www.youtube.com/watch?v=GBUHyVmGw7k"
          ls -la /tmp/test_caption*.json3 && echo "✅ Caption extraction works!" || (echo "❌ Caption extraction failed" && exit 1)

      - name: Run ingestion
        run: |
          COLLECTION=${{ github.event.inputs.collection || 'ufo' }}
          LIMIT=${{ github.event.inputs.limit || '5' }}
          SKIP_LLM=${{ github.event.inputs.skip_llm || 'false' }}
          
          ARGS="--collection=${COLLECTION} --limit=${LIMIT}"
          if [ "$SKIP_LLM" = "true" ]; then
            ARGS="${ARGS} --skip-llm"
          fi
          
          echo "Running: npx tsx src/scripts/ingest.ts ${ARGS}"
          npx tsx src/scripts/ingest.ts ${ARGS}

      - name: Summary
        if: always()
        run: echo "Ingestion complete at $(date -u)"
